name: Release

# Publish a release on GitHub (Releases → Draft a new release → tag v0.5.1) or push a tag like v0.5.1,
# and this builds, tests and attaches the packages to that release:
#   lumafx-<version>.tgz, lumafx-mcp-<version>.tgz and lumafx-wordpress.zip
on:
  push:
    tags: ['v*']
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Build the MCP server
        working-directory: mcp
        run: |
          npm ci
          npm run build
          npm test
      - name: Pack
        run: |
          npm pack
          (cd mcp && npm pack --pack-destination ..)
          cp dist/lumafx-wordpress.zip lumafx-wordpress.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "lumafx ${TAG#v}" --generate-notes
          gh release upload "$TAG" lumafx-*.tgz lumafx-wordpress.zip --clobber
